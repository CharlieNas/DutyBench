[project]
name = "dutybench"
version = "0.1.0"
description = "Does a customer-support AI agent follow UK consumer-credit duties? A small hand-written agent harness plus an evaluation suite."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.104",   # model calls, behind our own core/llm.py interface
    "pydantic>=2.13",   # tool argument models: schema for the model + validation
    "pyyaml>=6.0",      # scenario files
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.14"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dutybench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["probes"]  # the original one-evening probe script, kept as it was

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import order, modern syntax, likely bugs
select = ["E", "F", "I", "UP", "B"]
