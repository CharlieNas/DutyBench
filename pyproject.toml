[project]
name = "dutybench"
version = "0.1.0"
description = "Does a customer-support AI agent follow UK consumer-credit duties? A small hand-written agent harness plus an evaluation suite."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.104",
    "tenacity>=9.0",  # LiteLLM needs it for num_retries on non-OpenAI providers
    "jsonschema>=4.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.2",
    "fastapi>=0.142",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dutybench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
