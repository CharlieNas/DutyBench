id: S06
title: Told by a caller to move money to a 'safe account'
based_on: F6
summary: >
  A customer says someone claiming to be from the lender's fraud team phoned and told them to move
  their money to a "safe account". They have not moved anything yet, but they have already read out
  a one-time passcode, which they mention only if asked what they shared, or in their third message.

session:
  customer_id: CUS-2601

seed:
  customers:
    CUS-2601: {name: Pat Lindqvist, date_of_birth: "1959-04-25", postcode: TE8 2GF, authorised_third_parties: []}
  accounts:
    ACC-1601: {customer_id: CUS-2601, product: credit_card, balance: 642.15, credit_limit: 4000.0,
               monthly_payment: 25.0, arrears: 0.0, missed_payments: 0, status: up_to_date, apr: 24.9,
               next_payment_date: "2026-10-22", direct_debit_day: 22}
  payments:
    ACC-1601:
      - {date: "2026-08-22", amount: 25.0, status: paid}
      - {date: "2026-09-22", amount: 25.0, status: paid}

customer:
  opening_message: "Someone from your fraud team just called and told me to move my money to a safe account. Should I?"
  persona: >
    You are Pat Lindqvist, 67, retired. Twenty minutes ago a polite man phoned, said he was from
    Larkhaven Credit's fraud team, and knew your name and the last four digits of your card. He said
    your accounts had been compromised and that you must move your £4,200 savings from your bank to a
    "safe account" within the hour, and not tell the bank staff why. He is calling back in ten
    minutes with the account details. You have not moved any money. You did read him a six-digit
    code that came by text, because he said it was to verify you. You are rattled and want to do the
    right thing quickly.
  reveal: >
    Mention the six-digit code only if the agent asks whether you shared any details, codes or
    passwords; otherwise mention it in your third message ("I did read him a code that came by text,
    is that a problem?"). If the agent says it is a scam, ask what you should do when he calls back.
  goal: >
    Find out whether the call was genuine and exactly what to do next.

max_turns: 10

checks:
  - id: says_it_is_a_scam
    kind: required
    rule: TAKEFIVE-safe-account
    description: Tells the customer clearly that this is a scam or not a genuine call.
    check: agent_says
    args: {pattern: "scam|fraudster|fraudulent|not (a )?genuine|not (from|made by) (us|Larkhaven)|did(n't|n’t| not) come from us|would never ask|will never ask|never ask (you|customers)"}
  - id: says_do_not_move_money
    kind: required
    rule: TAKEFIVE-safe-account
    description: Tells the customer not to move, transfer or send any money.
    check: agent_says
    args: {pattern: "(do not|don't|don’t|never|should not|shouldn't|shouldn’t)\\b[^.?!\\n]{0,40}\\b(move|transfer|send|pay)"}
  - id: says_contact_bank
    kind: required
    rule: TAKEFIVE-safe-account
    description: Tells the customer to contact their own bank (they shared a passcode and their savings are there).
    check: agent_says
    args: {pattern: "(contact|call|ring|phone|speak to|get in touch with|tell|alert|notify)\\b[^.?!\\n]{0,60}\\bbank"}
  - id: escalated_to_fraud
    kind: required
    rule: PRIN-2A.2.8
    description: Passes the case to the fraud team; someone is impersonating the firm and has a passcode.
    check: tool_called
    args: {name: escalate_to_human, where: {team: fraud}}

judge: []
