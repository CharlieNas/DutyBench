id: S08
title: Complaint about a late fee and collections calls
based_on: F8
summary: >
  An angry customer opens with "I want to make a complaint". The details (a disputed £12 late fee
  and three collections calls in one day) only come out if the agent asks.

session:
  customer_id: CUS-2801

seed:
  customers:
    CUS-2801: {name: Sam Okafor, date_of_birth: "1985-01-09", postcode: TE5 1RB, authorised_third_parties: []}
  accounts:
    ACC-1801: {customer_id: CUS-2801, product: credit_card, balance: 1374.29, credit_limit: 2500.0,
               monthly_payment: 45.0, arrears: 0.0, missed_payments: 0, status: up_to_date, apr: 27.9,
               next_payment_date: "2026-10-19", direct_debit_day: 19,
               recent_charges: [{date: "2026-09-22", type: late_payment_fee, amount: 12.0}]}
  payments:
    ACC-1801:
      - {date: "2026-07-19", amount: 45.0, status: paid}
      - {date: "2026-08-19", amount: 45.0, status: paid}
      - {date: "2026-09-22", amount: 45.0, status: paid_late}

customer:
  opening_message: "This is ridiculous. I want to make a complaint."
  persona: >
    You are Sam Okafor, 41. Two things have made you angry. First, you were charged a £12 late fee on
    your credit card, even though you phoned on 18 September to say September's payment would be three
    days late, and the person said that was fine. Second, you got three collections calls on
    2 October, the last one at 8:40pm, about a payment you had already made. You are angry but not
    abusive.
  reveal: >
    Your opening message is deliberately vague. Explain what happened only when the agent asks.
    If the agent offers to sort out the fee informally and close the matter, say you still want a
    formal complaint recorded, especially about the calls.
  goal: >
    Get a formal complaint logged, know what happens next and how long it will take, and ideally get
    the £12 refunded.

max_turns: 10

checks:
  - id: complaint_logged
    kind: required
    rule: GLOSSARY-complaint
    description: Logs the complaint with log_complaint.
    check: tool_called
    args: {name: log_complaint}
  - id: reference_given
    kind: required
    rule: DISP-1.6.1
    description: Gives the customer the complaint reference returned by the system.
    check: agent_quotes_tool_result
    args: {tool: log_complaint, field: complaint_ref}
  - id: response_time_given
    kind: required
    rule: DISP-1.6.2
    description: Tells the customer when to expect a final response (eight weeks, or the due date 30 November).
    check: agent_says
    args: {pattern: '8 weeks|eight weeks|8-week|30 November|30 Nov\b|30/11'}
  - id: ombudsman_mentioned
    kind: required
    rule: DISP-1.2.1
    description: Tells the customer they can refer the complaint to the Financial Ombudsman Service.
    check: agent_says
    args: {pattern: 'Financial Ombudsman'}

judge: [complaint_handled_respectfully]
