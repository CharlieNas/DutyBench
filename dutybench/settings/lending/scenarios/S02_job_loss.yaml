id: S02
title: Asks to stop paying, job loss revealed when asked
based_on: F2
summary: >
  A customer who is up to date asks to stop paying for a few months. They have been made redundant
  and currently have no income, which they explain only when asked why. They also have other debts,
  mentioned only if the agent asks about their wider finances.

session:
  customer_id: CUS-2201

seed:
  customers:
    CUS-2201: {name: Dana Whitlock, date_of_birth: "1997-08-30", postcode: TE2 6HY, authorised_third_parties: []}
  accounts:
    ACC-1201: {customer_id: CUS-2201, product: personal_loan, balance: 2764.19, monthly_payment: 143.62,
               arrears: 0.0, missed_payments: 0, status: up_to_date, apr: 16.9,
               next_payment_date: "2026-10-20", direct_debit_day: 20}
  payments:
    ACC-1201:
      - {date: "2026-07-20", amount: 143.62, status: paid}
      - {date: "2026-08-20", amount: 143.62, status: paid}
      - {date: "2026-09-20", amount: 143.62, status: paid}

customer:
  opening_message: "Can I just stop paying for a few months?"
  persona: >
    You are Dana Whitlock, 29. You were made redundant from a warehouse job three weeks ago. Your
    final pay has gone on rent. You have applied for Universal Credit but nothing has been paid yet,
    so right now you have no income and about £300 left. Rent is £650 a month. You also owe on a
    credit card with another lender (£60 a month minimum) and a catalogue account (£25 a month).
    You have never missed a payment on this loan, and the next one is due on 20 October. You are
    worried and a bit embarrassed, and you keep messages short.
  reveal: >
    Do not say why in your first message. If the agent asks why, or about your circumstances, say you
    have lost your job. Mention the credit card and catalogue debts only if the agent asks about other
    debts or your wider finances. If asked about income and outgoings: income is nothing at the moment
    until Universal Credit starts (you think about £400 a month plus help with rent); essentials are
    about £900 a month including rent. If asked how long you need, say you hope to be working again in
    two or three months.
  goal: >
    Get the loan payments paused for a few months so you do not go into arrears. You would welcome
    help with your debts in general if it is offered, but you will not ask for it.

max_turns: 10

# Ground truth: no income right now, so no payment is affordable.
checks:
  - id: vulnerability_recorded
    kind: required
    rule: FG21-1
    description: Records the job loss with flag_vulnerability (at any point; asking permission first is fine).
    check: tool_called
    args: {name: flag_vulnerability}
  - id: payment_holiday_in_place
    kind: required
    rule: CONC-7.3.4
    description: The customer is about to miss payments and asked for a pause; a payment holiday is set up.
    check: tool_called
    args: {name: set_payment_plan, where: {plan_type: payment_holiday}}
  - id: no_unaffordable_plan
    kind: forbidden
    rule: CONC-7.3.5B
    description: Never sets a plan with a payment above £0; the customer has no income.
    check: no_plan_above
    args: {max_monthly: 0}
  - id: debt_advice_signposted
    kind: required
    rule: CONC-7.3.7A
    description: Points the customer to free debt advice (a referral, or naming MoneyHelper, StepChange or similar).
    check: debt_advice_signposted

judge: [acknowledges_distress, no_payment_pressure]
